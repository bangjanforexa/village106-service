<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรับเรื่องร้องเรียนและแจ้งซ่อมส่วนกลาง - นิติบุคคล</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-hotel text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-xl font-bold">Smart Village Support</h1>
          <p class="text-xs text-indigo-200">ระบบรับเรื่องร้องเรียนและแจ้งซ่อมส่วนกลาง</p>
        </div>
      </div>
      <button onclick="toggleAdminModal()" class="text-sm bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-600 transition">
        <i class="fa-solid fa-lock mr-1 text-amber-400"></i> โหมดเจ้าหน้าที่ (Admin)
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

    <!-- Section 1: Dashboard KPI Counters -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-700 flex items-center">
          <i class="fa-solid fa-chart-pie mr-2 text-indigo-600"></i> ภาพรวมความคืบหน้า (Dashboard)
        </h2>
        <button onclick="loadTickets()" class="text-sm text-indigo-600 hover:underline">
          <i class="fa-solid fa-rotate-right"></i> รีเฟรชข้อมูล
        </button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="p-3 bg-blue-100 text-blue-600 rounded-lg text-xl"><i class="fa-solid fa-inbox"></i></div>
          <div>
            <p class="text-xs text-slate-500 font-medium">เรื่องทั้งหมด</p>
            <p id="kpi-total" class="text-2xl font-bold">0</p>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="p-3 bg-amber-100 text-amber-600 rounded-lg text-xl"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <div>
            <p class="text-xs text-slate-500 font-medium">รอดำเนินการ</p>
            <p id="kpi-pending" class="text-2xl font-bold text-amber-600">0</p>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="p-3 bg-purple-100 text-purple-600 rounded-lg text-xl"><i class="fa-solid fa-person-digging"></i></div>
          <div>
            <p class="text-xs text-slate-500 font-medium">กำลังดำเนินการ</p>
            <p id="kpi-inprogress" class="text-2xl font-bold text-purple-600">0</p>
          </div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
          <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg text-xl"><i class="fa-solid fa-circle-check"></i></div>
          <div>
            <p class="text-xs text-slate-500 font-medium">เสร็จสิ้นแล้ว</p>
            <p id="kpi-done" class="text-2xl font-bold text-emerald-600">0</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 2: Form แจ้งเรื่อง & รายการตรวจสอบ -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- ฟอร์มแจ้งเรื่อง -->
      <section class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h3 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b flex items-center">
          <i class="fa-solid fa-file-pen mr-2 text-indigo-600"></i> แจ้งเรื่อง / แจ้งซ่อม
        </h3>

        <form id="ticketForm" onsubmit="submitTicket(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ประเภท</label>
            <select id="type" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="แจ้งซ่อมสาธารณูปโภค">แจ้งซ่อมสาธารณูปโภค</option>
              <option value="ข้อร้องเรียน">ข้อร้องเรียน</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">หมวดหมู่</label>
            <select id="category" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="ไฟฟ้าส่องสว่าง/ไฟทาง">ไฟฟ้าส่องสว่าง/ไฟทาง</option>
              <option value="ถนน/ท่อระบายน้ำ/ทางเท้า">ถนน/ท่อระบายน้ำ/ทางเท้า</option>
              <option value="สวนหย่อม/ตัดแต่งต้นไม้">สวนหย่อม/ตัดแต่งต้นไม้</option>
              <option value="คลับเฮาส์/ฟิตเนส/สระว่ายน้ำ">คลับเฮาส์/ฟิตเนส/สระว่ายน้ำ</option>
              <option value="ความปลอดภัย/รปภ./กล้องวงจรปิด">ความปลอดภัย/รปภ./กล้องวงจรปิด</option>
              <option value="ขยะ/สิ่งปฏิกูล">ขยะ/สิ่งปฏิกูล</option>
              <option value="สัตว์เลี้ยง/เสียงรบกวน">สัตว์เลี้ยง/เสียงรบกวน</option>
              <option value="อื่นๆ">อื่นๆ</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">บ้านเลขที่ <span class="text-rose-500">*</span></label>
              <input type="text" id="houseNo" placeholder="เช่น 99/12" required class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">ความเร่งด่วน</label>
              <select id="priority" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="ปกติ">ปกติ</option>
                <option value="ด่วน">ด่วน</option>
                <option value="ฉุกเฉิน">ฉุกเฉิน</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อผู้แจ้ง / เบอร์โทรศัพท์</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="contactName" placeholder="ชื่อผู้แจ้ง" required class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
              <input type="tel" id="phone" placeholder="08X-XXX-XXXX" required class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">หัวข้อเรื่อง <span class="text-rose-500">*</span></label>
            <input type="text" id="title" placeholder="เช่น หลอดไฟเสาต้นซอย 4 ดับ" required class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">รายละเอียดเพิ่มเติม</label>
            <textarea id="description" rows="3" placeholder="ระบุตำแหน่งที่ชัดเจนหรือรายละเอียด..." class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow transition duration-200">
            <i class="fa-solid fa-paper-plane mr-1"></i> ส่งเรื่องให้นิติบุคคล
          </button>
        </form>
      </section>

      <!-- รายการแสดงความคืบหน้า (Public Timeline / Status Cards) -->
      <section class="lg:col-span-2 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
          <h3 class="text-base font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-list-check mr-2 text-indigo-600"></i> รายการสถานะการดำเนินงาน
          </h3>
          <div class="flex items-center space-x-2">
            <input type="text" id="searchInput" oninput="filterTickets()" placeholder="ค้นหาบ้านเลขที่ หรือ รหัส..." class="border rounded-lg px-3 py-1.5 text-xs bg-white outline-none focus:ring-1 focus:ring-indigo-500">
            <select id="statusFilter" onchange="filterTickets()" class="border rounded-lg px-2 py-1.5 text-xs bg-white outline-none">
              <option value="all">ทุกสถานะ</option>
              <option value="รอดำเนินการ">รอดำเนินการ</option>
              <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
              <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            </select>
          </div>
        </div>

        <!-- รายการ Tickets -->
        <div id="ticketsList" class="space-y-3">
          <p class="text-sm text-slate-400 text-center py-10">กำลังโหลดข้อมูลสถานะ...</p>
        </div>
      </section>

    </div>
  </main>

  <!-- Admin Modal สำหรับอัปเดตสถานะ -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-user-shield text-indigo-600 mr-2"></i> อัปเดตสถานะงาน (Admin)
        </h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสเรื่อง</label>
          <input type="text" id="modalTicketId" readonly class="w-full bg-slate-100 border rounded-lg p-2 font-mono text-slate-600">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">สถานะใหม่</label>
          <select id="modalStatus" class="w-full border rounded-lg p-2 bg-slate-50">
            <option value="รอดำเนินการ">รอดำเนินการ</option>
            <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
            <option value="รออะไหล่/ผู้รับเหมา">รออะไหล่/ผู้รับเหมา</option>
            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
            <option value="ยกเลิก">ยกเลิก</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ผู้รับผิดชอบ / ทีมงาน</label>
          <input type="text" id="modalAssigned" placeholder="เช่น ช่างสมชาย, บ.กำจัดปลวก" class="w-full border rounded-lg p-2 bg-slate-50">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">บันทึกความคืบหน้า (ลูกบ้านจะเห็นข้อความนี้)</label>
          <textarea id="modalNotes" rows="2" placeholder="เช่น เข้าตรวจหน้างานแล้ว กำลังสั่งซื้ออะไหล่หลอด LED..." class="w-full border rounded-lg p-2 bg-slate-50"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่าน Admin เพื่อยืนยัน</label>
          <input type="password" id="modalPassword" placeholder="ใส่รหัสผ่านนิติบุคคล" class="w-full border rounded-lg p-2 bg-slate-50">
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t">
        <button onclick="toggleAdminModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-sm">ยกเลิก</button>
        <button onclick="saveAdminUpdate()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">บันทึกการอัปเดต</button>
      </div>
    </div>
  </div>

  <script>
    // URL Web App จาก Google Apps Script ของคุณ
    const API_URL = "https://script.google.com/macros/s/AKfycbwX5NMkW8Efb7z6m6aRj2dtq8c-TJRm_YEVTWTj01LMfCzPpMUim0FO4rCvtjx04sUV/exec";

    let ticketsData = [];

    async function loadTickets() {
      const container = document.getElementById("ticketsList");
      container.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังซิงค์ข้อมูล...</div>`;

      try {
        const res = await fetch(`${API_URL}?action=getTickets`);
        ticketsData = await res.json();
        updateDashboard();
        renderTickets(ticketsData);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="text-center py-8 text-rose-500"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบสิทธิ์การเข้าถึง Web App</div>`;
      }
    }

    function updateDashboard() {
      document.getElementById("kpi-total").innerText = ticketsData.length;
      document.getElementById("kpi-pending").innerText = ticketsData.filter(t => t.Status === "รอดำเนินการ").length;
      document.getElementById("kpi-inprogress").innerText = ticketsData.filter(t => t.Status === "กำลังดำเนินการ" || t.Status === "รออะไหล่/ผู้รับเหมา").length;
      document.getElementById("kpi-done").innerText = ticketsData.filter(t => t.Status === "เสร็จสิ้น").length;
    }

    function renderTickets(list) {
      const container = document.getElementById("ticketsList");
      if (!list || list.length === 0) {
        container.innerHTML = `<p class="text-center py-8 text-slate-400">ยังไม่มีรายการที่บันทึก</p>`;
        return;
      }

      const sorted = [...list].reverse();

      container.innerHTML = sorted.map(t => {
        const badgeColor = 
          t.Status === 'เสร็จสิ้น' ? 'bg-emerald-100 text-emerald-700 border-emerald-300' :
          t.Status === 'กำลังดำเนินการ' ? 'bg-purple-100 text-purple-700 border-purple-300' :
          t.Status === 'รออะไหล่/ผู้รับเหมา' ? 'bg-orange-100 text-orange-700 border-orange-300' :
          'bg-amber-100 text-amber-700 border-amber-300';

        const priorityBadge = t.Priority === 'ฉุกเฉิน' ? '<span class="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">ฉุกเฉิน</span>' : '';

        return `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition">
            <div class="flex justify-between items-start gap-2">
              <div>
                <div class="flex items-center space-x-2">
                  <span class="text-xs font-mono font-bold text-slate-500">${t.Ticket_ID}</span>
                  <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">${t.Category || 'ทั่วไป'}</span>
                  ${priorityBadge}
                </div>
                <h4 class="font-bold text-slate-800 mt-1">${t.Title}</h4>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${badgeColor}">${t.Status}</span>
            </div>

            <p class="text-xs text-slate-600 mt-2 bg-slate-50 p-2.5 rounded-lg border border-slate-100">${t.Description || '-'}</p>

            <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center text-xs text-slate-500 gap-2">
              <div class="space-x-3">
                <span><i class="fa-solid fa-house mr-1 text-slate-400"></i>แปลง: ${t.House_No}</span>
                <span><i class="fa-solid fa-wrench mr-1 text-slate-400"></i>ผู้ดูแล: ${t.Assigned_To || 'รอจัดสรร'}</span>
              </div>
              <button onclick="openAdminEdit('${t.Ticket_ID}', '${t.Status}', '${t.Assigned_To || ''}', '${t.Admin_Notes || ''}')" class="text-indigo-600 hover:text-indigo-800 font-medium">
                <i class="fa-solid fa-pen-to-square"></i> อัปเดตสถานะ
              </button>
            </div>
            ${t.Admin_Notes ? `<div class="mt-2 text-[11px] text-indigo-700 bg-indigo-50/70 p-2 rounded border border-indigo-100"><i class="fa-solid fa-bullhorn mr-1"></i> <strong>ความคืบหน้า:</strong> ${t.Admin_Notes}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function filterTickets() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;

      const filtered = ticketsData.filter(t => {
        const matchText = (t.Ticket_ID + " " + t.House_No + " " + t.Title).toLowerCase().includes(q);
        const matchStatus = status === "all" || t.Status === status;
        return matchText && matchStatus;
      });
      renderTickets(filtered);
    }

    async function submitTicket(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังบันทึกข้อมูล...`;

      const payload = {
        action: "createTicket",
        data: {
          type: document.getElementById("type").value,
          category: document.getElementById("category").value,
          houseNo: document.getElementById("houseNo").value,
          contactName: document.getElementById("contactName").value,
          phone: document.getElementById("phone").value,
          title: document.getElementById("title").value,
          description: document.getElementById("description").value,
          priority: document.getElementById("priority").value
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          alert(`แจ้งเรื่องสำเร็จ! รหัสอ้างอิงของคุณคือ: ${result.ticketId}`);
          document.getElementById("ticketForm").reset();
          loadTickets();
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i> ส่งเรื่องให้นิติบุคคล`;
      }
    }

    function toggleAdminModal() {
      const modal = document.getElementById("adminModal");
      modal.classList.toggle("hidden");
      modal.classList.toggle("flex");
    }

    function openAdminEdit(id, status, assigned, notes) {
      document.getElementById("modalTicketId").value = id;
      document.getElementById("modalStatus").value = status;
      document.getElementById("modalAssigned").value = assigned;
      document.getElementById("modalNotes").value = notes;
      document.getElementById("modalPassword").value = "";
      toggleAdminModal();
    }

    async function saveAdminUpdate() {
      const ticketId = document.getElementById("modalTicketId").value;
      const status = document.getElementById("modalStatus").value;
      const assignedTo = document.getElementById("modalAssigned").value;
      const adminNotes = document.getElementById("modalNotes").value;
      const password = document.getElementById("modalPassword").value;

      if (!password) {
        alert("กรุณากรอกรหัสผ่าน Admin");
        return;
      }

      const payload = {
        action: "updateTicket",
        password: password,
        data: { ticketId, status, assignedTo, adminNotes }
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          alert("อัปเดตสถานะสำเร็จ!");
          toggleAdminModal();
          loadTickets();
        } else {
          alert(result.message || "รหัสผ่านไม่ถูกต้อง");
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการอัปเดต");
      }
    }

    window.onload = loadTickets;
  </script>
</body>
